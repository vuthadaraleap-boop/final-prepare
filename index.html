// Flatten all questions across categories into a single master array (110 questions)
const MASTER_QUESTIONS = Object.keys(SOURCE_QUIZZES).reduce((acc, key) => {
  return acc.concat(SOURCE_QUIZZES[key].questions);
}, []);

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

let state={idx:0,score:0,deck:null,answered:false};

function showMenu(){
  state={idx:0,score:0,deck:null,answered:false};
  const app=document.getElementById('app');
  app.innerHTML='';
  
  const title=document.createElement('h2');
  title.style.cssText='font-size:24px;font-weight:700;text-align:center;margin:0 0 8px;color:#F1F5F9;';
  title.textContent='Web Architecture Review Engine';
  app.appendChild(title);
  
  const sub=document.createElement('p');
  sub.style.cssText='font-size:15px;color:#94A3B8;text-align:center;margin:0 0 2.5rem;line-height:1.5;';
  sub.textContent='This track shuffles and compiles all curriculum data arrays across UI/UX, Figma, HTML, and CSS into a single master verification pool.';
  app.appendChild(sub);
  
  const container=document.createElement('div');
  container.style.cssText='display:flex; flex-direction:column; gap:16px;';
  
  const card=document.createElement('button');
  card.style.cssText='text-align:left;padding:24px;border:1px solid #334155;background:rgba(30, 41, 59, 0.6);border-radius:16px;cursor:pointer;transition:all 0.25s ease;box-shadow:0 4px 10px rgba(0,0,0,0.15);outline:none;';
  
  card.onmouseenter=()=>{
    card.style.borderColor='#6366F1';
    card.style.background='rgba(99, 102, 241, 0.1)';
    card.style.transform='translateY(-2px)';
    card.style.boxShadow='0 8px 20px rgba(99, 102, 241, 0.15)';
  };
  card.onmouseleave=()=>{
    card.style.borderColor='#334155';
    card.style.background='rgba(30, 41, 59, 0.6)';
    card.style.transform='none';
    card.style.boxShadow='0 4px 10px rgba(0,0,0,0.15)';
  };
  
  card.innerHTML='<p style="margin:0;font-weight:600;font-size:18px;color:#FFFFFF;">Initialize Review Track</p><p style="margin:6px 0 0;font-size:14px;color:#94A3B8;">Comprehensive Simulation • '+MASTER_QUESTIONS.length+' Total Questions Mixed Globally</p>';
  card.onclick=startMasterReview;
  container.appendChild(card);
  app.appendChild(container);
}

function startMasterReview(){
  state.idx=0;state.score=0;state.answered=false;
  
  state.deck=shuffle(MASTER_QUESTIONS.map((_,i)=>i)).map(i=>{
    const c=MASTER_QUESTIONS[i].o[MASTER_QUESTIONS[i].c];
    const opts=shuffle(MASTER_QUESTIONS[i].o);
    return{q:MASTER_QUESTIONS[i].q,opts,correct:c};
  });
  renderQ();
}

function renderQ(){
  const app=document.getElementById('app');
  const item=state.deck[state.idx];
  app.innerHTML='';
  
  const top=document.createElement('div');
  top.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;';
  
  const back=document.createElement('button');
  back.textContent='← Back to Menu';
  back.style.cssText='background:none;border:none;color:#94A3B8;cursor:pointer;font-size:13px;font-weight:600;padding:4px 0;transition:color 0.2s ease;';
  back.onmouseenter=()=>back.style.color='#6366F1';
  back.onmouseleave=()=>back.style.color='#94A3B8';
  back.onclick=()=>{if(confirm('Quit active exam evaluation and drop tracking variables?'))showMenu();};
  
  const scoreEl=document.createElement('span');
  scoreEl.style.cssText='font-size:13px;font-weight:700;color:#818CF8;letter-spacing:0.5px;text-transform:uppercase;';
  scoreEl.textContent='Score: '+state.score;
  
  top.appendChild(back);top.appendChild(scoreEl);app.appendChild(top);
  
  const counter=document.createElement('div');
  counter.style.cssText='font-size:11px;font-weight:700;color:#64748B;margin-bottom:8px;letter-spacing:0.75px;text-transform:uppercase;';
  counter.innerHTML='<span>QUESTION '+(state.idx+1)+' OF '+state.deck.length+'</span>';
  app.appendChild(counter);
  
  const prog=document.createElement('div');
  prog.style.cssText='height:6px;background:#334155;border-radius:10px;margin-bottom:2.5rem;overflow:hidden;';
  const fill=document.createElement('div');
  fill.style.cssText='height:100%;width:'+Math.round((state.idx/state.deck.length)*100)+'%;background:linear-gradient(90deg, #6366F1, #A855F7);border-radius:10px;transition:width 0.4s ease;box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);';
  prog.appendChild(fill);app.appendChild(prog);
  
  const q=document.createElement('p');
  q.style.cssText='font-size:19px;font-weight:600;line-height:1.5;margin:0 0 2rem;color:#F1F5F9;';
  q.textContent=item.q;
  app.appendChild(q);
  
  const opts=document.createElement('div');
  opts.style.cssText='display:flex;flex-direction:column;gap:14px;';
  item.opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.textContent=opt;
    btn.style.cssText='text-align:left;padding:16px 22px;font-size:15px;font-weight:500;line-height:1.4;border-radius:14px;border:1px solid #334155;background:rgba(30, 41, 59, 0.7);color:#CBD5E1;cursor:pointer;transition:all 0.2s ease;outline:none;box-shadow: 0 4px 6px rgba(0,0,0,0.1);';
    
    btn.onmouseenter=()=>{if(!state.answered){btn.style.borderColor='#6366F1';btn.style.background='rgba(99, 102, 241, 0.15)';btn.style.color='#FFFFFF';btn.style.transform='translateY(-1px)';}};
    btn.onmouseleave=()=>{if(!state.answered){btn.style.borderColor='#334155';btn.style.background='rgba(30, 41, 59, 0.7)';btn.style.color='#CBD5E1';btn.style.transform='none';}};
    btn.onclick=()=>answer(opt,item.correct,opts);
    opts.appendChild(btn);
  });
  app.appendChild(opts);
  
  const foot=document.createElement('div');
  foot.id='foot';
  foot.style.cssText='margin-top:2.5rem;display:flex;justify-content:space-between;align-items:center;min-height:50px;';
  app.appendChild(foot);
}

function answer(opt,correct,btns){
  if(state.answered)return;
  state.answered=true;
  const isRight=opt===correct;
  if(isRight)state.score++;
  
  [...btns.children].forEach(b=>{
    b.style.cursor='default';
    b.style.transform='none';
    if(b.textContent===correct){
      b.style.borderColor='#10B981';b.style.background='rgba(16, 185, 129, 0.15)';b.style.color='#34D399';b.style.boxShadow='0 0 15px rgba(16, 185, 129, 0.2)';
    }else if(b.textContent===opt){
      b.style.borderColor='#EF4444';b.style.background='rgba(239, 68, 68, 0.15)';b.style.color='#F87171';
    }else{b.style.opacity='0.25';}
  });
  
  const foot=document.getElementById('foot');
  const msg=document.createElement('span');
  msg.style.cssText='font-size:15px;font-weight:700;letter-spacing:0.5px;color:'+(isRight?'#34D399':'#F87171')+';';
  msg.textContent=isRight?'✓ CORRECT':'✕ INCORRECT';
  
  const next=document.createElement('button');
  next.style.cssText='padding:14px 28px;font-size:14px;font-weight:600;border-radius:12px;border:none;background:linear-gradient(90deg, #6366F1, #4F46E5);color:#ffffff;cursor:pointer;transition:all 0.2s;box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);';
  next.onmouseenter=()=>{next.style.filter='brightness(1.1)';next.style.transform='translateY(-1px)';};
  next.onmouseleave=()=>{next.style.filter='none';next.style.transform='none';};
  
  next.textContent=state.idx<state.deck.length-1?'Next Question →':'See Evaluation 📊';
  next.onclick=()=>{state.idx++;state.answered=false;state.idx<state.deck.length?renderQ():results();};
  foot.appendChild(msg);foot.appendChild(next);
}

function results(){
  const app=document.getElementById('app');
  const pct=Math.round((state.score/state.deck.length)*100);
  let note='', accentColor='', glowColor='';
  
  if(pct===100){
    note='Perfect compile verification! Total layout architectural core mastery confirmed.';
    accentColor='#10B981';glowColor='rgba(16, 185, 129, 0.2)';
  }else if(pct>=80){
    note='Excellent execution. Highly proficient compilation accuracy score tracked.';
    accentColor='#6366F1';glowColor='rgba(99, 102, 241, 0.2)';
  }else if(pct>=50){
    note='Passing threshold complete. Re-run node configuration streams to patch gaps.';
    accentColor='#F59E0B';glowColor='rgba(245, 158, 11, 0.2)';
  }else{
    note='Optimization requested. Re-evaluate structural variables and logic flows.';
    accentColor='#EF4444';glowColor='rgba(239, 68, 68, 0.2)';
  }
  
  app.innerHTML='';
  const card=document.createElement('div');
  card.style.cssText='border-radius:20px;padding:3rem 2rem;text-align:center;background:rgba(30, 41, 59, 0.6);border:1px solid #334155;box-shadow: 0 10px 30px rgba(0,0,0,0.2);';
  card.innerHTML='<p style="font-size:13px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:#94A3B8;margin:0 0 12px;">Review Sequence Complete</p>'+
    '<p style="font-size:56px;font-weight:800;margin:0;color:#F8FAFC;">'+state.score+'<span style="font-size:28px;font-weight:500;color:#64748B;"> / '+state.deck.length+'</span></p>'+
    '<p style="font-size:26px;font-weight:700;color:'+accentColor+';margin:10px 0 16px;text-shadow: 0 0 15px '+glowColor+';">'+pct+'%</p>'+
    '<p style="font-size:15px;font-weight:400;color:#94A3B8;line-height:1.6;margin:0 0 2.5rem;max-width:360px;margin-left:auto;margin-right:auto;">'+note+'</p>';
    
  const btnDiv=document.createElement('div');
  btnDiv.style.cssText='display:flex;gap:14px;justify-content:center;';
  
  const retry=document.createElement('button');
  retry.textContent='Retake Review';
  retry.style.cssText='padding:14px 24px;font-size:14px;font-weight:600;border-radius:12px;border:1px solid #475569;background:#334155;color:#F8FAFC;cursor:pointer;transition:all 0.2s;';
  retry.onmouseenter=()=>{retry.style.background='#475569';retry.style.borderColor='#64748B';};
  retry.onmouseleave=()=>{retry.style.background='#334155';retry.style.borderColor='#475569';};
  retry.onclick=startMasterReview;
  
  btnDiv.appendChild(retry);
  card.appendChild(btnDiv);
  app.appendChild(card);
}

showMenu();
</script>
